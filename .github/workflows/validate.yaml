name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-profile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1c
      - name: Validate repository
        shell: pwsh
        run: ./scripts/validate.ps1
      - name: Test llama-benchy receipt parser
        shell: pwsh
        run: ./tests/parse-results.ps1
      - name: Test process discovery
        shell: pwsh
        run: ./tests/process-discovery.ps1
